<html>
<head>
<title>ランダム選曲(高難易度のみ)</title>
<style>
button.aaa {width: 100px;padding: 5px;box-sizing: border-box;border: 1px solid #68779a;background: #cbe8fa;cursor: pointer;font-size: 150%}
form.a {width: 400px;margin: 0 left}
</style>
</head>
<body onload="load()">
<h1>高難易度ランダム選曲</h1>
<p>高難易度(MAS33~37,APD33~37)の中から難易度を選び、ランダムで選曲できる機構です</p>
<form name="diflv" class="a">
<fieldset>
<legend>難易度を選んでください</legend>
MASTER:
<label><input type="checkbox" name="dl" value="MASTER33" checked>33</label>
<label><input type="checkbox" name="dl" value="MASTER34" checked>34</label>
<label><input type="checkbox" name="dl" value="MASTER35" checked>35</label>
<label><input type="checkbox" name="dl" value="MASTER36" checked>36</label>
<label><input type="checkbox" name="dl" value="MASTER37" checked>37</label>
<br>
APPEND:
<label><input type="checkbox" name="dl" value="APPEND33" checked>33</label>
<label><input type="checkbox" name="dl" value="APPEND34" checked>34</label>
<label><input type="checkbox" name="dl" value="APPEND35" checked>35</label>
<label><input type="checkbox" name="dl" value="APPEND36" checked>36</label>
<label><input type="checkbox" name="dl" value="APPEND37" checked>37</label>
<label><input type="checkbox" name="dl" value="APPEND38" disabled>38</label>
</fieldset>
</form>
3曲選曲する:<input type="checkbox" id="dani_dojo" class="checkbox">
<p id="random_object"></p>
<p id="random_seed"></p>
<button type="button" name="name" onclick="random()" class="aaa">選曲</button>
<h1 id="result"></h1>
<h1 id="result1"></h1>
<h1 id="result2"></h1>
<script type="text/javascript">
function random(){
var flag = false;
var rand_m = ["tell your world"];
var rand_c = 0;
document.getElementById("random_seed").textContent = '';
for(var i=0; i<document.diflv.dl.length;i++){
if(document.diflv.dl[i].checked){
flag = true;
document.getElementById("random_object").textContent = '選択中の難易度';
document.getElementById("random_seed").textContent += document.diflv.dl[i].value;
document.getElementById("random_seed").textContent += ',';
if(i == 0){//M33
rand_m.push("ロストワンの号哭","初音天地開闢神話","ゴーストルール","僕らの16bit戦争","MarbleBlue.(MAS)","嬢王(MAS)","生命性シンドロウム(MAS)");
}else if(i == 1){//M34
rand_m.push("初音ミクの激唱","ÅMARA(大未来電脳)","おぎゃりないざー(MAS)","ダイジョブですか？(MAS)","メモリア(MAS)");
}else if(i == 2){//M35
rand_m.push("初音ミクの消失","六兆年と一夜物語","マシンガンポエムドール","エンドマークに希望と涙を添えて","Don't fight the music","腐れ外道とチョコレゐト");
}else if(i == 3){//M36
rand_m.push("the EmpErroR");
}else if(i == 4){//M37
rand_m.push("What's up? Pop!","ヤミナベ!!!!","人生");
}else if(i == 5){//A33
rand_m.push("キラー(APD)","カゲロウデイズ(APD)","Iなんです(APD)","トンデモワンダーズ(APD)","ドーナツホール 2024(APD)","混沌ブギ(APD)","アンヘル(APD)","snooze(APD)","のだ(APD)");
}else if(i == 6){//A34
rand_m.push("ヒバナ-Reloaded-(APD)","東京テディベア(APD)","プロトディスコ(APD)","フュージョン(APD)");
}else if(i == 7){//A35
rand_m.push("Brand New Day(APD)","folern(APD)","超最終鬼畜妹フランドール・S(APD)");
}else if(i == 8){//A36
rand_m.push("Sage(APD)","嬢王(APD)","生命性シンドロウム(APD)");
}else if(i == 9){//A37
rand_m.push("MarbleBlue.(APD)","おぎゃりないざー(APD)","ダイジョブですか？(APD)","メモリア(APD)");
}else if(i == 10){//A38
//rand_m.push("このメッセージは本来出現しないようになってるけど、もしでたら制作者に教えてね！");
}
}
}
if(!flag){
alert("難易度が選択されていません。");
document.getElementById("random_object").textContent = '選択中の難易度';
document.getElementById("random_seed").textContent = 'なし';
}else{
rand_m.shift();
var rand_c = rand_m.length;
var RN = Math.floor( Math.random() * rand_c );
document.getElementById("result").textContent = '選ばれたのは、' + rand_m[RN] + 'でした。';
if(document.getElementById("dani_dojo").checked){
var RN = Math.floor( Math.random() * rand_c );
document.getElementById("result1").textContent = '選ばれたのは、' + rand_m[RN] + 'でした。';
var RN = Math.floor( Math.random() * rand_c );
document.getElementById("result2").textContent = '選ばれたのは、' + rand_m[RN] + 'でした。';
}else{
document.getElementById("result1").textContent = '';
document.getElementById("result2").textContent = '';
}
}
}
function load(){//読み込み時に実行される関数
console.log("最終更新:2025/2/17\nMASTER:なし\nAPPEND:フュージョン(APD)追加");
}
</script>
</body>
</html>
